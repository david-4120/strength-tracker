<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Strength</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>
<div id="timer" hidden>
  <div class="tbar"><div class="tfill" id="tfill"></div></div>
  <div class="trow"><div class="tmid"><span class="tlbl" id="tlbl">REST</span> <span class="tclock" id="tclock">3:00</span></div></div>
  <div class="trow tbtns">
    <button class="tbtn" data-a="rest+">+30s</button>
    <button class="tbtn" data-a="restset" data-m="3">3m</button>
    <button class="tbtn" data-a="restset" data-m="4">4m</button>
    <button class="tbtn" data-a="restset" data-m="5">5m</button>
    <button class="tbtn skip" data-a="restskip">Skip</button>
  </div>
</div>
<nav id="tabs">
  <a href="#/home" data-tab="home"><span class="ti">⌂</span>Home</a>
  <a href="#/history" data-tab="history"><span class="ti">☰</span>History</a>
  <a href="#/prs" data-tab="prs"><span class="ti">★</span>PRs</a>
  <a href="#/settings" data-tab="settings"><span class="ti">⚙</span>Settings</a>
</nav>
<nav id="wnav" hidden>
  <button class="btn" data-a="prev" id="wprev">‹ Prev</button>
  <button class="btn primary" data-a="next" id="wnext">Next ›</button>
</nav>
<div id="toast" hidden></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
